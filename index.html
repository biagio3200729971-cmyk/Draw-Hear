  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050505;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      font-family: 'Noto Serif SC', serif;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }
    
    canvas {
      touch-action: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      pointer-events: auto;
      display: block;
    }
    
    .cursor-none {
      cursor: none;
    }
  </style>
